<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='720' fill='none' stroke='white' stroke-linecap='round' stroke-linejoin='round' opacity='0.04'>
<!-- The cage (the grid, card and About backgrounds, in place of the other sports' chalk plays): the
     octagon's chain-link fence, barely there. Each wire zig-zags up the fence and hooks around its
     neighbor at every bend, so the diamonds meet in a small twisted knuckle at their left and right
     points; thin wire, and a faint roughness so it doesn't look printed. -->
<filter id='c'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='5' result='t'/><feDisplacementMap in='SourceGraphic' in2='t' scale='0.9'/></filter>
<defs>
<pattern id='mesh' width='26' height='36' patternUnits='userSpaceOnUse'>
<!-- One wire's zig-zag (down the left half of the tile), and its neighbor's (the right half) -->
<path d='M2 0 C6 4 9 9 11.2 14.6 C11.8 16.2 12.2 17 13 18 C12.2 19 11.8 19.8 11.2 21.4 C9 27 6 32 2 36' stroke-width='1.25'/>
<path d='M24 0 C20 4 17 9 14.8 14.6 C14.2 16.2 13.8 17 13 18 C13.8 19 14.2 19.8 14.8 21.4 C17 27 20 32 24 36' stroke-width='1.25'/>
<!-- The knuckle where the two hook together -->
<path d='M11.4 16.2 C12.4 15.2 13.6 15.2 14.6 16.2 M11.4 19.8 C12.4 20.8 13.6 20.8 14.6 19.8' stroke-width='0.8'/>
<!-- The bends at the tile's edges, hooking into the next wires over -->
<path d='M0.6 -1.6 C1.6 -0.6 2.4 0.6 2.4 0.6 M0.6 37.6 C1.6 36.6 2.4 35.4 2.4 35.4 M25.4 -1.6 C24.4 -0.6 23.6 0.6 23.6 0.6 M25.4 37.6 C24.4 36.6 23.6 35.4 23.6 35.4' stroke-width='0.8'/>
</pattern>
</defs>
<g filter='url(#c)'><rect width='1400' height='720' fill='url(#mesh)' stroke='none'/></g>
</svg>
