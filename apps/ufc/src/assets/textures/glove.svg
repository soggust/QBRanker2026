<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- An MMA glove (the slider knobs, the settings switches and the loading screen), seen from the back
       of the hand: squared off like an MMA glove rather than a boxing glove's round mitt. A flat-topped,
       boxy knuckle pad in fight-night red over the black curled fingers, a squared thumb on the side,
       and the white wrist strap with its velcro. Shaded from the top left. -->
  <defs>
    <linearGradient id="pad" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ff5a50"/>
      <stop offset="0.5" stop-color="#c8141c"/>
      <stop offset="1" stop-color="#6e0a0e"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ccd2"/>
    </linearGradient>
  </defs>
  <!-- The curled fingers (black, peeking above the pad) -->
  <rect x="12" y="7" width="40" height="14" rx="4" fill="#141414"/>
  <path d="M22 8 V20 M32 8 V20 M42 8 V20" stroke="#3a3a3e" stroke-width="1.2"/>
  <!-- The padded knuckles: boxy, with small rounded corners -->
  <rect x="10" y="12" width="44" height="29" rx="6" fill="url(#pad)" stroke="#3a0406" stroke-width="1.6"/>
  <!-- The knuckle seams -->
  <path d="M21.5 14 V39 M32 14 V39 M42.5 14 V39" fill="none" stroke="#7a0a10" stroke-width="1.2" opacity="0.6"/>
  <!-- The thumb -->
  <rect x="4" y="21" width="8" height="15" rx="2.5" fill="#c8141c" stroke="#3a0406" stroke-width="1.4"/>
  <!-- The wrist strap -->
  <rect x="13" y="40" width="38" height="16" rx="3" fill="url(#strap)" stroke="#1a1a1a" stroke-width="1.6"/>
  <rect x="17" y="44" width="30" height="8" rx="1.5" fill="#111"/>
  <rect x="20" y="46.5" width="24" height="3" rx="1" fill="#c8141c"/>
</svg>
