<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- An MMA glove (the slider knobs and the settings switches), seen from the back of the hand: the
       padded knuckles in fight-night red, the fingers curled under in black, the open thumb on the
       side, and the white wrist strap with its velcro. Shaded from the top left. -->
  <defs>
    <radialGradient id="pad" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff5a50"/>
      <stop offset="0.55" stop-color="#c8141c"/>
      <stop offset="1" stop-color="#6e0a0e"/>
    </radialGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ccd2"/>
    </linearGradient>
  </defs>
  <!-- The curled fingers (black, under the pad) -->
  <path d="M12 22 C12 12 20 6 32 6 C44 6 52 12 52 22 V30 H12 Z" fill="#141414"/>
  <!-- The padded knuckles -->
  <path d="M10 26 C10 14 19 8 32 8 C45 8 54 14 54 26 C54 36 47 42 32 42 C17 42 10 36 10 26 Z" fill="url(#pad)" stroke="#3a0406" stroke-width="1.6"/>
  <!-- The knuckle seams -->
  <path d="M21 13 C20 20 20 28 22 36 M32 10 V40 M43 13 C44 20 44 28 42 36" fill="none" stroke="#7a0a10" stroke-width="1.2" opacity="0.6"/>
  <!-- The thumb -->
  <path d="M6 30 C3 24 6 18 11 19 C13 22 13 28 12 33 Z" fill="#c8141c" stroke="#3a0406" stroke-width="1.4"/>
  <!-- The wrist strap -->
  <rect x="13" y="40" width="38" height="16" rx="5" fill="url(#strap)" stroke="#1a1a1a" stroke-width="1.6"/>
  <rect x="17" y="44" width="30" height="8" rx="2.5" fill="#111"/>
  <rect x="20" y="46.5" width="24" height="3" rx="1.5" fill="#c8141c"/>
</svg>
