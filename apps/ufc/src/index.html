<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UFC Ranker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The app's octagon: SVG for browsers that support it (sharp at any size), PNG as fallback -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" sizes="64x64" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!-- Loading screen, shown while the ranking data and app load (Angular replaces it when the
         app starts; main.ts swaps in an error message if the data can't be loaded) -->
    <style>
      .app-loading {
        align-items: center;
        display: flex;
        inset: 0;
        justify-content: center;
        position: fixed;
      }

      /* An octagon-cut panel like the UFC buttons: the red edge is the panel, the black face a smaller
         octagon inside it */
      .app-loading-panel {
        --cut: 10px;
        align-items: center;
        background: #d61a1f;
        clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut));
        color: #f4f1ec;
        display: flex;
        font-family: "Nunito", sans-serif;
        font-size: 14px;
        font-weight: 500;
        gap: 18px;
        isolation: isolate;
        letter-spacing: 1.5px;
        max-width: calc(100vw - 48px);
        padding: 18px 28px 18px 22px;
        position: relative;
        text-transform: uppercase;
      }

      .app-loading-panel::before {
        --c: calc(var(--cut) - 1.2px);
        background: linear-gradient(180deg, #26262a, #121214);
        clip-path: polygon(calc(var(--c) + 2px) 2px, calc(100% - var(--c) - 2px) 2px, calc(100% - 2px) calc(var(--c) + 2px), calc(100% - 2px) calc(100% - var(--c) - 2px), calc(100% - var(--c) - 2px) calc(100% - 2px), calc(var(--c) + 2px) calc(100% - 2px), 2px calc(100% - var(--c) - 2px), 2px calc(var(--c) + 2px));
        content: "";
        inset: 0;
        position: absolute;
        z-index: -1;
      }

      /* A fight glove throwing a double jab at you: it snaps out (bigger, a little twist) and back,
         twice, then a beat */
      .app-loading-ball {
        animation: app-loading-jab 1.4s ease-in-out infinite;
        background: url("assets/textures/glove.svg") center / 100% 100% no-repeat;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.7));
        flex: 0 0 auto;
        height: 28px;
        width: 28px;
      }

      .app-loading.failed .app-loading-ball {
        animation: none;
        opacity: 0.5;
        transform: rotate(-30deg);
      }

      .app-loading.failed .app-loading-text {
        color: #ff7468;
        letter-spacing: 0.5px;
        text-transform: none;
      }

      @keyframes app-loading-jab {
        0%, 30%, 60%, 100% {
          transform: scale(1) rotate(0deg);
        }
        12%, 42% {
          transform: scale(1.5) rotate(-12deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading-ball {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-loading" role="status" aria-live="polite">
        <div class="app-loading-panel">
          <span class="app-loading-ball" aria-hidden="true"></span>
          <span class="app-loading-text">Loading fighters…</span>
        </div>
      </div>
    </app-root>
  </body>
</html>
