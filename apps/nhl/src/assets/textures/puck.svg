<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A hockey puck seen from above (the slider knobs, the switches, the filter menu's logo and the
       favicon): vulcanized black rubber with the knurled grip band around its edge, a soft sheen from
       the light, and the raised center face -->
  <defs>
    <radialGradient id="rubber" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#3a3d42"/>
      <stop offset="0.55" stop-color="#18191c"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="face" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#2c2e33"/>
      <stop offset="1" stop-color="#0d0e10"/>
    </radialGradient>
    <pattern id="knurl" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="4" fill="#111215"/>
      <rect width="2" height="2" fill="#2e3036"/>
    </pattern>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#rubber)"/>
  <!-- The knurled band -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#knurl)" stroke-width="5"/>
  <circle cx="32" cy="32" r="25.6" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="0.8"/>
  <!-- The face -->
  <circle cx="32" cy="32" r="25" fill="url(#face)"/>
  <ellipse cx="25" cy="21" rx="13" ry="7" fill="#fff" opacity="0.09" transform="rotate(-25 25 21)"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#000" stroke-width="1.4"/>
</svg>
