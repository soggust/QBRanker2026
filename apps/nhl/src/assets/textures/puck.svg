<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A hockey puck seen from above (the slider knobs, the switches, the filter menu's logo and the
       favicon): a flat disc of matte black rubber (an even face with only a faint sheen across it, so
       it reads as a disc rather than a ball), the knurled grip band around its edge, and the game
       puck's embossed logo ring in the middle -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2c30"/>
      <stop offset="0.45" stop-color="#1b1c1f"/>
      <stop offset="1" stop-color="#141517"/>
    </linearGradient>
    <pattern id="knurl" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="4" fill="#141518"/>
      <rect width="2" height="2" fill="#6a6e78"/>
    </pattern>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#0b0b0c"/>
  <!-- The knurled band -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#knurl)" stroke-width="5.5"/>
  <!-- The face -->
  <circle cx="32" cy="32" r="24.6" fill="url(#face)"/>
  <circle cx="32" cy="32" r="24.6" fill="none" stroke="#000" stroke-opacity="0.7" stroke-width="1"/>
  <!-- The embossed logo ring and shield -->
  <circle cx="32" cy="32" r="13" fill="none" stroke="#fff" stroke-opacity="0.13" stroke-width="1.6"/>
  <path d="M26 25 H38 V33 C38 37 35 39.5 32 40.5 C29 39.5 26 37 26 33 Z" fill="none" stroke="#fff" stroke-opacity="0.13" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="30.4" fill="none" stroke="#7a7f8a" stroke-opacity="0.55" stroke-width="1.4"/>
  <!-- The rim catching the light -->
  <path d="M10 22 A24 24 0 0 1 22 9" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1.2" stroke-linecap="round"/>
</svg>
