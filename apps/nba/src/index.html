<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NBA Ranker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The app's basketball: SVG for browsers that support it (sharp at any size), PNG as fallback -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" sizes="64x64" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!-- Loading screen, shown while the ranking data and app load (Angular replaces it when the
         app starts; main.ts swaps in an error message if the data can't be loaded) -->
    <style>
      .app-loading {
        align-items: center;
        display: flex;
        inset: 0;
        justify-content: center;
        position: fixed;
      }

      .app-loading-panel {
        align-items: center;
        background: var(--scoreboard-dots, none), #121212;
        border: 1px solid #3a3a3a;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        color: #fff;
        display: flex;
        font-family: "Orbitron", sans-serif;
        font-size: 14px;
        font-weight: 500;
        gap: 16px;
        letter-spacing: 1.5px;
        max-width: calc(100vw - 48px);
        padding: 18px 26px;
        text-transform: uppercase;
      }

      /* A spinning basketball, like the logo and the slider knobs */
      .app-loading-ball {
        animation: app-loading-spin 1.1s linear infinite;
        background: url("favicon.svg") center / 100% 100% no-repeat;
        border-radius: 50%;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.75);
        flex: 0 0 auto;
        height: 20px;
        width: 20px;
      }

      .app-loading.failed .app-loading-ball {
        animation: none;
        transform: rotate(-40deg);
      }

      .app-loading.failed .app-loading-text {
        color: #ff7468;
        letter-spacing: 0.5px;
        text-transform: none;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading-ball {
          animation: none;
          transform: rotate(-40deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-loading" role="status" aria-live="polite">
        <div class="app-loading-panel">
          <span class="app-loading-ball" aria-hidden="true"></span>
          <span class="app-loading-text">Loading rankings…</span>
        </div>
      </div>
    </app-root>
  </body>
</html>
