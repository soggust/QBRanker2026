<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>
  <!-- A basketball, tipped a little toward you: a shaded sphere of pebbled orange leather (lit from the
       top left, darkening to its rim), its black rubber channels curving over it (the band around the
       middle, the one over the top, and the two side curves), and a soft gloss -->
  <defs>
    <radialGradient id='body' cx='38%' cy='32%' r='72%'>
      <stop offset='0' stop-color='#f0894a'/>
      <stop offset='0.4' stop-color='#d4662b'/>
      <stop offset='0.78' stop-color='#a4481b'/>
      <stop offset='1' stop-color='#65270c'/>
    </radialGradient>
    <radialGradient id='gloss' cx='34%' cy='26%' r='30%'>
      <stop offset='0' stop-color='#fff' stop-opacity='0.45'/>
      <stop offset='1' stop-color='#fff' stop-opacity='0'/>
    </radialGradient>
    <filter id='pebble' x='0' y='0' width='100%' height='100%'>
      <feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='1' seed='4' result='n'/>
      <feDiffuseLighting in='n' surfaceScale='1.4' lighting-color='#fff' result='l'>
        <feDistantLight azimuth='225' elevation='50'/>
      </feDiffuseLighting>
      <feComposite in='l' in2='SourceGraphic' operator='in'/>
    </filter>
    <clipPath id='ball'><circle cx='32' cy='32' r='30'/></clipPath>
  </defs>
  <circle cx='32' cy='32' r='30' fill='url(#body)'/>
  <circle cx='32' cy='32' r='30' fill='#fff' filter='url(#pebble)' opacity='0.32' style='mix-blend-mode:overlay'/>
  <g clip-path='url(#ball)' fill='none' stroke-linecap='round'>
    <g stroke='rgba(255,210,170,0.22)' stroke-width='3.6' transform='translate(0.6 0.9)'>
      <path d='M1 33 C18 42 46 42 63 33'/>
      <path d='M35 1 C26 20 26 44 33 63'/>
      <path d='M9 9 C23 22 22 46 9 57'/>
      <path d='M54 6 C42 20 42 44 56 55'/>
    </g>
    <g stroke='#1c0e07' stroke-width='2.8'>
      <path d='M1 33 C18 42 46 42 63 33'/>
      <path d='M35 1 C26 20 26 44 33 63'/>
      <path d='M9 9 C23 22 22 46 9 57'/>
      <path d='M54 6 C42 20 42 44 56 55'/>
    </g>
  </g>
  <circle cx='32' cy='32' r='30' fill='url(#gloss)'/>
  <circle cx='32' cy='32' r='29.4' fill='none' stroke='rgba(40,14,4,0.55)' stroke-width='1.2'/>
</svg>
