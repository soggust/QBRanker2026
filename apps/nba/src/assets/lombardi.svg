<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 32">
  <!-- The #1 trophy (used as a mask, so only its shape matters): the Larry O'Brien Trophy, a basketball
       dropping into a netted rim atop a tall, slender cup on a stepped base. The file keeps its name so
       the shared styles find it. -->
  <defs>
    <mask id="seams">
      <rect width="24" height="32" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="0.5" stroke-linecap="round">
        <path d="M12 2.2 V11.4"/>
        <path d="M7.4 6.8 H16.6"/>
        <path d="M8.9 3.4 C10.6 5 10.6 8.6 8.9 10.2 M15.1 3.4 C13.4 5 13.4 8.6 15.1 10.2"/>
      </g>
    </mask>
    <mask id="net">
      <rect width="24" height="32" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="0.45">
        <path d="M9 12.6 L11 16.4 M11.3 12.6 L13 16 M13.6 12.6 L14.8 15.2 M15 12.6 L13 16.4 M12.7 12.6 L11 16 M10.4 12.6 L9.2 15.2"/>
      </g>
    </mask>
  </defs>
  <circle cx="12" cy="6.8" r="4.6" mask="url(#seams)"/>
  <rect x="6.6" y="11.2" width="10.8" height="1.3" rx="0.6"/>
  <path d="M7.4 12.5 H16.6 L14.6 16.8 H9.4 Z" mask="url(#net)"/>
  <path d="M9.4 16.8 H14.6 L14 26.6 H10 Z"/>
  <path d="M8.6 26.8 H15.4 L16.4 28.6 H7.6 Z"/>
  <rect x="6.2" y="28.9" width="11.6" height="2.3" rx="0.6"/>
</svg>
