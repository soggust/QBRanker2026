<!-- Sport bar: a link to each sport's app on this site (the page shrinks by its height) -->
<nav class="sport-bar" aria-label="Sport">
  @for (s of sports; track s.id) {
    <a [href]="'/' + s.id + '/'" [class.active]="s.id === sport" [attr.aria-current]="s.id === sport ? 'page' : null">{{ s.label }}</a>
  }
  <!-- The site's name on the far right, after a little podium (#1 on the middle step) in the sport's color;
       a click reloads this sport's page fresh, from the top -->
  <a class="brand" [href]="'/' + sport + '/'" title="Season Ranker: reload">
    <svg class="brand-logo" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 1.5l1.3 2.7 3 .4-2.2 2 .6 2.9-2.7-1.4-2.7 1.4.6-2.9-2.2-2 3-.4z" />
      <rect x="8.5" y="11" width="7" height="11.5" rx="1" />
      <rect x="1.5" y="15" width="6.5" height="7.5" rx="1" opacity="0.7" />
      <rect x="16" y="17" width="6.5" height="5.5" rx="1" opacity="0.5" />
    </svg>
    <span class="brand-name">Season Ranker</span>
  </a>
</nav>

<main [class.menu-open]="menuOpen" [class.sidebar-collapsed]="sidebarCollapsed">
  <!-- Filters menu: opened by the footer's filter button, closed by its X (or the shade on small screens) -->
  <div class="sidebar-shell">
    <sidebar class="sidebar"></sidebar>
  </div>
  <div class="shade" (click)="closeFilters()"></div>

  @let position = position$ | async;
  <div class="content">

    <!-- Rankings: every tab is the same config-driven table (see positions.ts) -->
    @if (position) {
      <skill-rankings class="rankings" [position]="position">
        <!-- Position tabs: shown between the rankings' button bar and the grid, as wide as the grid -->
        <nav class="position-bar" aria-label="Position">
          @for (tab of positions; track tab) {
            <button
              type="button"
              [class.active]="tab === position"
              [attr.aria-current]="tab === position ? 'page' : null"
              (click)="selectPosition(tab)"
            >
              <span class="full">{{ positionNames[tab] }}</span>
              <span class="short">{{ tab }}</span>
            </button>
          }
          <!-- Phones: one dropdown instead of eight pills (native, so it opens the phone's own picker) -->
          <select
            class="position-select"
            aria-label="Position"
            [value]="position"
            (change)="selectPosition($any($event.target).value)"
          >
            @for (tab of positions; track tab) {
              <option [value]="tab" [selected]="tab === position">{{ positionNames[tab] }}</option>
            }
          </select>
        </nav>
      </skill-rankings>
    }
  </div>
</main>

<!-- About / FAQ, opened from the info button in the footer -->
@if (aboutOpen$ | async) {
  <about-panel (closed)="closeAbout()"></about-panel>
}
