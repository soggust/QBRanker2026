<main [class.menu-open]="menuOpen" [class.sidebar-collapsed]="sidebarCollapsed">
  <!-- Sidebar, with a pull tab on its right edge that slides it in and out (on small screens the
       tab sits at the bottom of the left edge and rides along with the slide-out menu) -->
  <div class="sidebar-shell">
    <sidebar class="sidebar"></sidebar>
    <button
      type="button"
      class="drawer-tab"
      (click)="toggleDrawer()"
      [attr.aria-expanded]="drawerOpen"
      [attr.aria-label]="drawerOpen ? 'Hide filters' : 'Show filters'"
      [title]="drawerOpen ? 'Hide filters' : 'Show filters'"
    >
      <mat-icon [fontIcon]="drawerOpen ? 'close' : 'filter_alt'"></mat-icon>
    </button>
  </div>
  <div class="shade" (click)="menuOpen = false"></div>

  @let position = position$ | async;
  <div class="content">
    <!-- Position Bar -->
    <nav class="position-bar" aria-label="Position">
      @for (tab of positions; track tab) {
        <button
          type="button"
          [class.active]="tab === position"
          [attr.aria-current]="tab === position ? 'page' : null"
          (click)="selectPosition(tab)"
        >
          <span class="full">{{ positionNames[tab] }}</span>
          <span class="short">{{ tab }}</span>
        </button>
      }
      <!-- Phones: one dropdown instead of eight pills (native, so it opens the phone's own picker) -->
      <select
        class="position-select"
        aria-label="Position"
        [value]="position"
        (change)="selectPosition($any($event.target).value)"
      >
        @for (tab of positions; track tab) {
          <option [value]="tab" [selected]="tab === position">{{ positionNames[tab] }}</option>
        }
      </select>
    </nav>

    <!-- Rankings (QB stays mounted so switching tabs doesn't refetch ESPN stats) -->
    <rankings class="rankings" [hidden]="position !== 'QB'"></rankings>
    @if (position && position !== 'QB') {
      <skill-rankings class="rankings" [position]="position"></skill-rankings>
    }
  </div>
</main>

<!-- About / FAQ, opened from the info button in the footer -->
@if (aboutOpen$ | async) {
  <about-panel (closed)="closeAbout()"></about-panel>
}
