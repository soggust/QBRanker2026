name: NBA - Update Game Data

on:
  schedule:
    # Nightly at 11:17 UTC (6:17 AM CDT): after the last West Coast games are final and
    # Basketball-Reference has caught up, and clear of the NFL and MLB updates (they share one queue, see
    # concurrency). The 13:47 UTC run is a backup for a delayed or dropped one; a run with nothing new
    # (the offseason, or no games that night) is a no-op (no commit, no deploy).
    - cron: "17 11 * * *"
    - cron: "47 13 * * *"
  workflow_dispatch:

# One update at a time: a run that starts while another is still going waits for it
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # A new season that has begun (yesterday's games on ESPN) becomes current before the night's
      # update: the finished one is archived as a past season (scripts/rollover.mjs)
      - name: Roll over to a new season
        run: node scripts/rollover.mjs nba --if-due

      # (the regular season, and once the playoffs have begun the playoffs and both too:
      # skill-players.post.json and .all.json; before then any old ones are removed)
      - name: Pull stats from Basketball-Reference and ESPN
        run: npm run nba:update-data

      # (Wikipedia's coaching staffs: a failed fetch keeps yesterday's file)
      - name: Build coaching staffs
        run: node apps/nba/scripts/build-coaches.mjs || echo "coaches skipped"

      # (the highlights' YouTube upload pages and the day's search count, kept between runs: the daily search
      # cap holds across runs, and a run only pages back to what it's seen)
      - name: Restore the highlights cache
        uses: actions/cache@v6
        with:
          path: .cache/highlights
          key: nba-highlights-${{ github.run_id }}
          restore-keys: nba-highlights-

      # (each finished game's highlights, kept for the game view before ESPN lets them go)
      - name: Keep game highlights
        env:
          # (optional: with a YouTube Data API key, a game ESPN has no videos for is found on the league's YouTube channel)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node libs/ranker/scripts/highlights.mjs nba || echo "highlights skipped"

      # (the data checked before it's committed: a broken file stays out of master and off the site; npm test)
      - name: Install dependencies
        # (npm install, not npm ci: GitHub's npm wants lock entries ours resolves without; the lock is put back
        # as it was, so the commit step's pull --rebase sees a clean tree)
        run: |
          npm install
          git checkout -- package-lock.json

      - name: Check the data
        run: npm test

      - name: Commit updated data
        id: commit
        run: |
          git add apps/nba/src/StaticData apps/nba/scripts/update-data.mjs apps/nba/src/sport/sport.ts
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update NBA data"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here
      - name: Build project
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Install Firebase CLI
        if: steps.commit.outputs.changed == 'true'
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        if: steps.commit.outputs.changed == 'true'
        run: firebase deploy --token ${{ secrets.FIREBASE_TOKEN }}
