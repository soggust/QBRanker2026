name: NBA - Update Game Data

on:
  schedule:
    # Nightly at 11:17 UTC (6:17 AM CDT): after the last West Coast games are final and
    # Basketball-Reference has caught up, and clear of the NFL and MLB updates (they share one queue, see
    # concurrency). The 13:47 UTC run is a backup for a delayed or dropped one; a run with nothing new
    # (the offseason, or no games that night) is a no-op (no commit, no deploy).
    - cron: "17 11 * * *"
    - cron: "47 13 * * *"
  workflow_dispatch:

# One update at a time: a run that starts while another is still going waits for it
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A new season that has begun (yesterday's games on ESPN) becomes current before the night's
      # update: the finished one is archived as a past season (scripts/rollover.mjs)
      - name: Roll over to a new season
        run: node scripts/rollover.mjs nba --if-due

      - name: Pull stats from Basketball-Reference and ESPN
        run: npm run nba:update-data

      # (Wikipedia's coaching staffs: a failed fetch keeps yesterday's file)
      - name: Build coaching staffs
        run: node apps/nba/scripts/build-coaches.mjs || echo "coaches skipped"

      - name: Commit updated data
        id: commit
        run: |
          git add apps/nba/src/StaticData apps/nba/scripts/update-data.mjs apps/nba/src/sport/sport.ts
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update NBA data"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here
      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm install

      - name: Build project
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Install Firebase CLI
        if: steps.commit.outputs.changed == 'true'
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        if: steps.commit.outputs.changed == 'true'
        run: firebase deploy --token ${{ secrets.FIREBASE_TOKEN }}
