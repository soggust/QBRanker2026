name: NFL - Update Game Data

on:
  schedule:
    # Nightly at 09:13 UTC (4:13 AM CDT / 3:13 AM CST): hours after the last night game ends,
    # so a day's results and stats land together in one update. Off the top of the hour on
    # purpose: GitHub delays and sometimes drops scheduled runs set for :00, when everyone's
    # run at once. The 12:47 UTC run (7:47 AM CDT) is a backup for a delayed or dropped one;
    # a run with nothing new is a no-op (no commit, no deploy).
    - cron: "13 9 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch:

# One update at a time: a run that starts while another is still going waits for it
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull game results from ESPN
        run: npm run update-data

      - name: Commit updated data
        id: commit
        run: |
          git add apps/nfl/src/StaticData
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update game data from ESPN"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here
      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm install

      - name: Build project
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Install Firebase CLI
        if: steps.commit.outputs.changed == 'true'
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        if: steps.commit.outputs.changed == 'true'
        run: firebase deploy --token ${{ secrets.FIREBASE_TOKEN }}
