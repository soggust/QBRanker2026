name: NFL - Update Game Data

on:
  schedule:
    # Nightly at 08:13 UTC (4:13 AM EDT / 3:13 AM CDT): hours after the last night game ends.
    # Off the top of the hour on purpose: GitHub delays and sometimes drops scheduled runs set
    # for :00, when everyone's run at once. The 12:47 and 14:47 UTC runs are retries: the update
    # waits until ESPN's season stats cover every game in its results (update-data.mjs, a run
    # that holds writes nothing), and they also cover a delayed or dropped run. A run with
    # nothing new is a no-op (no commit, no deploy).
    - cron: "13 8 * * *"
    - cron: "47 12 * * *"
    - cron: "47 14 * * *"
  workflow_dispatch:

# One update at a time: a run that starts while another is still going waits for it
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # (the finished games' summaries already read, so a run reads only the new ones: update-data.mjs; and
      # nflverse's files, fresh for six hours, so the retry runs don't download them again: build-depth.mjs)
      - name: Restore the download caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/nfl-summaries
            .cache/nflverse
          key: nfl-cache-${{ github.run_id }}
          restore-keys: nfl-cache-

      # A new season that has begun (yesterday's games on ESPN) becomes current before the night's
      # update: the finished one is archived as a past season (scripts/rollover.mjs)
      - name: Roll over to a new season
        run: node scripts/rollover.mjs nfl --if-due

      # (the regular season, and once the playoffs have begun their own files beside it, the playoffs
      # and both together: *.post.json and *.all.json, the app's Stats From; none until then)
      - name: Pull game results from ESPN
        run: npm run update-data

      # The card's Roster tab: each team's depth chart, who's played and the injury report (nflverse, ESPN)
      - name: Build depth charts
        run: node apps/nfl/scripts/build-depth.mjs

      # (Wikipedia's staffs: a failed fetch keeps yesterday's file)
      - name: Build coaching staffs
        run: node apps/nfl/scripts/build-coaches.mjs || echo "coaches skipped"

      # (each finished game's highlights, kept for the game view before ESPN lets them go)
      - name: Keep game highlights
        env:
          # (optional: with a YouTube Data API key, every game is searched for, not only the channel's latest uploads)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node libs/ranker/scripts/highlights.mjs nfl || echo "highlights skipped"

      - name: Commit updated data
        id: commit
        run: |
          git add apps/nfl/src/StaticData apps/nfl/scripts/update-data.mjs apps/nfl/src/sport/sport.ts
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update game data from ESPN"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here
      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm install

      - name: Build project
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Install Firebase CLI
        if: steps.commit.outputs.changed == 'true'
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        if: steps.commit.outputs.changed == 'true'
        run: firebase deploy --token ${{ secrets.FIREBASE_TOKEN }}
