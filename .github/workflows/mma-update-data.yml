name: MMA - Update Game Data

on:
  schedule:
    # Nightly at 12:07 UTC (7:07 AM CDT): after a night's card is final, and clear of the other sports'
    # updates (they share one queue, see concurrency). The 14:37 UTC run is a backup for a delayed or
    # dropped one; a run with nothing new is a no-op (no commit, no deploy).
    - cron: "7 12 * * *"
    - cron: "37 14 * * *"
  workflow_dispatch:

# One update at a time: a run that starts while another is still going waits for it
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Pull MMA fights and stats
        run: npm run mma:update-data

      - name: Commit updated data
        id: commit
        run: |
          git add apps/mma/src/StaticData apps/mma/scripts/cache.json apps/mma/scripts/fights
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update MMA data"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # (no build or deploy while MMA is dev-only: npm run build leaves it out, so a deploy from here would
      # carry nothing new; when it launches, add ng build mma to the build and the deploy steps back, as in
      # the other sports' workflows)
