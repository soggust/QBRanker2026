name: MLB - Update Game Data

on:
  schedule:
    # Nightly at 10:33 UTC (5:33 AM CDT): after the last West Coast games are final and the MLB Stats
    # API and Baseball Savant have caught up, and clear of the NFL update (they share one queue, see
    # concurrency). The 13:07 UTC run is a backup for a delayed or dropped one; a run with nothing new
    # is a no-op (no commit, no deploy).
    - cron: "33 10 * * *"
    - cron: "7 13 * * *"
  workflow_dispatch:

# One update at a time: a run that starts while another is still going waits for it
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull stats from the MLB Stats API and Baseball Savant
        run: npm run mlb:update-data

      - name: Commit updated data
        id: commit
        run: |
          git add apps/mlb/src/StaticData
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update MLB data"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here
      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm install

      - name: Build project
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Install Firebase CLI
        if: steps.commit.outputs.changed == 'true'
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        if: steps.commit.outputs.changed == 'true'
        run: firebase deploy --token ${{ secrets.FIREBASE_TOKEN }}
